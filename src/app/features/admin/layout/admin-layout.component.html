<div class="admin-shell">
  <!-- Sidebar (Sticky 100vh with Smooth Collapse/Expand) -->
  <aside class="admin-sidebar" [class.sidebar-collapsed]="isSidebarCollapsed()">
    <div class="sidebar-brand">
      <div class="brand-left">
        <img src="images/logo.png" alt="ودق" class="logo" />
        <span class="badge badge-warning">لوحة التحكم</span>
      </div>

      <!-- Desktop Sidebar Collapse Toggle Button -->
      <button
        type="button"
        (click)="toggleSidebar()"
        class="desktop-collapse-btn"
        [title]="isSidebarCollapsed() ? 'توسيع القائمة الجانبية' : 'طي القائمة الجانبية'"
        [attr.aria-label]="isSidebarCollapsed() ? 'توسيع القائمة الجانبية' : 'طي القائمة الجانبية'"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="collapse-arrow" [class.arrow-flipped]="isSidebarCollapsed()">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <!-- Mobile Nav Collapse Toggle Button -->
      <button
        type="button"
        (click)="toggleNav()"
        class="nav-toggle-btn"
        [attr.aria-expanded]="!isNavCollapsed()"
        [attr.aria-label]="isNavCollapsed() ? 'فتح القائمة' : 'إغلاق القائمة'"
      >
        @if (isNavCollapsed()) {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        } @else {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        }
      </button>
    </div>

    <nav class="sidebar-nav" [class.nav-collapsed]="isNavCollapsed()">
      <!-- 1. Products Management (First / Default Page) -->
      <a routerLink="/admin/products" routerLinkActive="active" (click)="closeNav()" class="nav-item" title="إدارة المنتجات">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="nav-text">إدارة المنتجات</span>
      </a>

      <!-- 2. Product Analytics & Store Statistics (Dedicated Page) -->
      <a routerLink="/admin/analytics" routerLinkActive="active" (click)="closeNav()" class="nav-item" title="تحليلات وإحصائيات المتجر">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span class="nav-text">تحليلات وإحصائيات المتجر</span>
      </a>

      <a routerLink="/admin/categories" routerLinkActive="active" (click)="closeNav()" class="nav-item" title="التصنيفات">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span class="nav-text">التصنيفات</span>
      </a>

      <a routerLink="/admin/packages" routerLinkActive="active" (click)="closeNav()" class="nav-item" title="باقات التجهيز">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span class="nav-text">باقات التجهيز</span>
      </a>

      <a routerLink="/admin/projects" routerLinkActive="active" (click)="closeNav()" class="nav-item" title="معرض المشاريع">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span class="nav-text">معرض المشاريع</span>
      </a>

      <a routerLink="/admin/settings" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeNav()" class="nav-item" title="المحتوى والإعدادات (CMS)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span class="nav-text">المحتوى والإعدادات (CMS)</span>
      </a>

      <a
        routerLink="/admin/settings"
        [queryParams]="{ section: 'aiConsultant' }"
        (click)="closeNav()"
        class="nav-item"
        title="الأسئلة الشائعة والمستشار الذكي"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span class="nav-text">الأسئلة الشائعة والمستشار</span>
      </a>

      <!-- Quick Store Link inside Mobile Nav -->
      <a routerLink="/ar" class="nav-item mobile-store-link" title="واجهة المتجر">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="nav-text">واجهة المتجر</span>
      </a>
    </nav>

    <!-- Anchored Sidebar Footer (Always visible in viewport, never pushed down) -->
    <div class="sidebar-footer">
      <a routerLink="/ar" class="store-link" title="واجهة المتجر">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="store-link-text">واجهة المتجر</span>
      </a>
    </div>
  </aside>

  <!-- Main Body -->
  <div class="admin-main">
    <!-- Top bar -->
    <header class="admin-topbar">
      <div class="topbar-start">

        <div class="user-greeting">
          <span>المسؤول:</span>
          <strong>{{ auth.currentUser()?.email }}</strong>
        </div>
      </div>

      <div class="topbar-actions">
        <!-- Theme Toggle in Admin -->
        <button
          (click)="theme.toggleTheme()"
          class="btn btn-outline btn-sm theme-btn"
          [title]="theme.isDark() ? 'التحويل للمظهر الفاتح' : 'التحويل للمظهر الداكن'"
        >
          @if (theme.isDark()) {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
            </svg>
            <span>المظهر الفاتح</span>
          } @else {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span>المظهر الداكن</span>
          }
        </button>

        <button (click)="auth.logout()" class="btn btn-outline btn-sm logout-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>تسجيل الخروج</span>
        </button>
      </div>
    </header>

    <div class="admin-page-content">
      <router-outlet />
    </div>
  </div>

  <!-- Global Admin Decision Confirmation Modal -->
  <app-confirm-dialog />
</div>
