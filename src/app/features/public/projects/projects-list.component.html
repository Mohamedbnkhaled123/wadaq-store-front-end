<div class="projects-page" *transloco="let t">
  <div class="container">
    <header class="page-header animate-fade-down">
      <span class="section-tag">معرض الأعمال والتجهيزات</span>
      <h1 class="page-title">{{ t('projects.title') }}</h1>
      <p class="page-subtitle">{{ t('projects.subtitle') }}</p>
    </header>

    @if (isLoading()) {
      <div class="projects-grid">
        <div class="project-skeleton card">
          <div class="skeleton-img skeleton"></div>
          <div class="skeleton-body">
            <div class="skeleton skeleton-line-title"></div>
            <div class="skeleton skeleton-line-desc"></div>
          </div>
        </div>
        <div class="project-skeleton card">
          <div class="skeleton-img skeleton"></div>
          <div class="skeleton-body">
            <div class="skeleton skeleton-line-title"></div>
            <div class="skeleton skeleton-line-desc"></div>
          </div>
        </div>
      </div>
    } @else {
      <div class="projects-grid animate-fade-up delay-75">
        @for (proj of projects(); track proj._id) {
          <app-project-card [project]="proj" />
        }
      </div>
    }
  </div>
</div>
